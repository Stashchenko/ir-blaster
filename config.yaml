esphome:
  name: ir-blaster
  friendly_name: IRBlaster
esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino
    sdkconfig_options:
      # @grigi found in testing that these options resulted in better responsiveness.
      # BLE 4.2 is supported by ALL ESP32 boards that have bluetooth, the original and derivatives.
      CONFIG_BT_BLE_42_FEATURES_SUPPORTED: y
      # Also enable this on any derivative boards (S2, C3 etc) but not the original ESP32.
      CONFIG_BT_BLE_50_FEATURES_SUPPORTED: y
      # Extend the watchdog timeout, so the device reboots if the device appears locked up for over 10 seconds.
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "10"

logger:
  baud_rate: 0  # disable serial uart logging

api:
  encryption:
    key: "oxDpsGUOwgsejqX3MoOxN9ESxAmoWejYpmd5BE66mX0="
  # Only enable BLE tracking when wifi is up and api is connected
  # Gives single-core ESP32-C3 devices time to manage wifi and authenticate with api
  on_client_connected:
    - esp32_ble_tracker.start_scan:
        continuous: true
  # Disable BLE tracking when there are no api connections live
  on_client_disconnected:
    if:
      condition:
        not:
          api.connected:
      then:
        - esp32_ble_tracker.stop_scan:
ota:
  - platform: esphome
    password: "65751248db00db7a46a00144a4320b33"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "IRBlaster"
    password: "ysh3EjULOExU"
  power_save_mode: NONE
  fast_connect: true

captive_portal:

# bluetooth proxy
esp32_ble:
  max_connections: 1
  connection_timeout: 20s

esp32_ble_tracker:
  scan_parameters:
    continuous: false
    active: false
    interval: 1000ms
    window: 300ms
bluetooth_proxy:
  active: true
  connection_slots: 2

remote_transmitter:
  id: ir_tx
  pin: GPIO7
  carrier_duty_percent: 50%

remote_receiver:
  id: rcvr
  pin:
    number: GPIO6
    inverted: true
    mode:
      input: true
      pullup: true
  tolerance: 30%

infrared:
  # IR transmitter instance
  - platform: ir_rf_proxy
    name: IR Proxy Transmitter
    id: ir_proxy_tx
    remote_transmitter_id: ir_tx
  # IR receiver instance
  - platform: ir_rf_proxy
    name: IR Proxy Receiver
    id: ir_proxy_rx
    remote_receiver_id: rcvr

binary_sensor:
  - platform: status
    name: "Device Status"

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    id: wifi_signal_db
    entity_category: "diagnostic"
    internal: true

  - platform: copy
    source_id: wifi_signal_db
    name: "WiFi Signal Percent"
    icon: mdi:wifi
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: " %"
    entity_category: "diagnostic"
    device_class: ""
